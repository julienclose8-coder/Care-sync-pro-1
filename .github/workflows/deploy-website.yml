name: Deploy website to cPanel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'supabase/**'
      - '**.md'

permissions:
  contents: read

concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://wcrbdotwhvbukzcscktb.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_DmIlnLesXNtua_lgHma2OQ_zzf03s0E
      - name: Upload to cPanel over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./
